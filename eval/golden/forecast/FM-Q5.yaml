reference_answer: Yes, the competitor assumption. Before launch the national forecast ran 0.6% high over 72 weeks. After launch it ran 5.4% high in March and April, 12.7% in May and June, 13.7% in July and August, and 12.4% from September to October 5. The gap is persistent, broad and matches BXA's share loss to Metacora.
