anchor: New England 2026-05-04; Great Lakes 2026-07-06
story_text: As the analyst, I want invalid actuals caught before any driver is named, so that I never explain a miss the data invented.
given: an InvestigationRequest for a week whose actual is provisional.
when: the agent validates input.
then: it pauses or qualifies the case, names the feed reasons, and makes no driver claim.
reference_answer: 'The forecast was 440 and the actual 267: V = −173, or −39.3%. But the forecast table marks the actual provisional, and the feed shows why: 44 missing keys, coverage 0.656, late delivery. The national miss that week (−608, −12.3%) is provisional too. A second case: Great Lakes on 2026-07-06 shows an actual of 670 that includes 46 duplicated TRx; without them it is 624.'
must_not_say:
  text: '"New England missed forecast by 39%."'
  phrases:
  - New England missed forecast by 39%
  semantic: []
action: The analyst re-queues the case for after the reload. The report tells the analyst which feed to wait for.
