id: C-002
lane: briefing
story: P1-Q2
persona: P1 Commercial Analyst (Ace)
category: data_artifact
scenario: null
split: dev
status: draft
question: 'Week of 2026-05-04: Is this week''s data complete, and which cuts can''t I report?'
review_note: null
period: week of 2026-05-04
anchor: New England incomplete feed, 2026-05-04
story_text: As Ace, I want feed problems found before drafting, so that I never write commentary on numbers that are wrong.
given: New England fails the feed gate for 2026-05-04.
when: the brief runs.
then: the data-health section leads the brief, names New England as not reportable with its three reasons, reports the other seven, and labels national totals "7 of 8."
reference_answer: New England delivered 84 of 128 rows (44 missing keys), panel coverage 0.656 against a 0.98 floor, 10.29 days after week end against a 7-day target; status INCOMPLETE. Its observed BXA TRx of 267 compares with 397 to 422 in the four weeks before. The other seven territories pass.
must_not_say:
  text: '"New England BXA fell 34%."'
  phrases:
  - New England BXA fell 34%
  semantic: []
action: Ace leaves New England out of the commentary and adds it to next week's re-check list. The brief tells Ace to re-run New England when the reload lands and to disclose the restated week.
eval_items:
- EV-2.1
- EV-2.3
- EV-1.1
facts:
- id: ne_rows_observed
  value: 84
  sql: select observed_rows from reporting.v_feed_health where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND'
- id: ne_missing_keys
  value: 44
  sql: select missing_key_count from reporting.v_feed_health where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND'
- id: ne_panel_coverage
  value: 0.656
  sql: select panel_coverage_ratio from reporting.v_feed_health where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND'
- id: ne_days_late
  value: 10.29
  sql: select actual_lag_days from reporting.v_feed_health where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND'
- id: ne_source_status
  value: INCOMPLETE
  sql: select source_status from reporting.v_feed_health where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND'
- id: ne_bxa_trx_observed
  value: 267
  sql: select sum(trx) from raw.rx_weekly where week_start = DATE '2026-05-04' and territory_id = 'NEW_ENGLAND' and product_id = 'BXA'
- id: ne_prior_4wk_min
  value: 397
  sql: select min(s) from (select week_start, sum(trx) s from reporting.v_weekly_rx_kpis where product_id = 'BXA' and territory_id = 'NEW_ENGLAND' and week_start between DATE '2026-04-06' and DATE '2026-04-27' group by 1)
- id: ne_prior_4wk_max
  value: 422
  sql: select max(s) from (select week_start, sum(trx) s from reporting.v_weekly_rx_kpis where product_id = 'BXA' and territory_id = 'NEW_ENGLAND' and week_start between DATE '2026-04-06' and DATE '2026-04-27' group by 1)
