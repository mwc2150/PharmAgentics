story_text: As Marcus, I want every claim answered against the numbers as they stood at sign-off, so that a challenge does not mean rebuilding the analyst's work.
given: a challenge to a Lipidara figure for a week where the territory's cut was withheld.
when: someone challenges the April number.
then: its evidence link opens the gated view on the pinned snapshot, shows Mid-Atlantic as withheld, and the restatement record shows no BXC row, so no restated figure is quoted.
reference_answer: 'Mid-Atlantic''s cut for the week of 2026-04-06 is withheld for restatement review, so national BXC TRx is 3,892 across 7 of 8 territories, with no Mid-Atlantic figure in it. No Lipidara figure was restated: the restatement log holds no row for BXC, and none for Mid-Atlantic that week. The only restatement in the release belongs to another product. A challenge to a Mid-Atlantic Lipidara number for that week is answered with the withheld flag, not with a restated value.'
