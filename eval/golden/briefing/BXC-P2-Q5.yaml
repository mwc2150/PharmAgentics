  text: '"Lipidara Mid-Atlantic TRx was restated", or any Mid-Atlantic BXC figure for that week.'
  phrases:
  - Lipidara Mid-Atlantic TRx was restated
  semantic: []
action: 'Marcus answers on the spot: the Mid-Atlantic cut was withheld, and nothing was restated for Lipidara.'
