story_text: As Ace, I want normal territory swings left out, so that the brief is consistent week to week and nobody chases noise.
given: a week with no injected event and normal territory noise.
when: the Lipidara (BXC) brief runs.
then: 'it is a routine brief: KPI table, no stories, at most one line that territory swings stayed in their normal range.'
reference_answer: 'National BXC TRx was 4,590, 2.6% below its 4-week average. Territories swung widely: Mid-Atlantic up 29.6% week over week, South Central down 23.0%, Southeast down 17.9% and Northwest down 16.4%. Those swings are normal here: before Metacora launched, outside holiday weeks, a territory moved more than 15% in a week in 15.3% to 27.1% of weeks. No Lipidara access change sits in that week (there is none in the whole release) and BXC inventory fill was 0.970 or higher in every territory.'
must_not_say:
  text: '"Mid-Atlantic surged 30%."'
  phrases:
  - Mid-Atlantic surged 30%
  semantic: []
action: Ace ships the routine brief in minutes. The brief tells Ace nothing needs investigating.
eval_items:
- EV-3.2
- EV-3.3
