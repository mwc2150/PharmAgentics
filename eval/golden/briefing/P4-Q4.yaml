story_text: As Magdalena, I want lifts tested against access, competitors and season, so that I never claim credit for a formulary win.
given: a lift that follows an access restoration and a seasonal rise, with steady promotion.
when: the brief tests promotion.
then: promotion is "ruled out," access is the leading driver, and the seasonal share is noted.
reference_answer: BXA on the Mid-Atlantic Medicare Part D plan rose 19% (183 to 218 TRx a week) and NBRx 42% against the summer, right after the plan removed prior authorization and step therapy on 2025-11-01. Mid-Atlantic rep calls stayed near 50 a week. National BXA rose 14.4% over the same weeks, so part of the lift is seasonal.
