story_text: As Magdalena, I want lifts tested against access, competitors and season, so that I never claim credit for a formulary win.
given: a lift that follows an access restoration and a seasonal rise, with steady promotion.
when: the brief tests promotion.
then: promotion is "not testable" (its activity held level), access is the leading driver, and the seasonal share is noted.
reference_answer: BXA on the Mid-Atlantic Medicare Part D plan rose 21% (183 to 222 TRx a week) and NBRx 39% against the summer, right after the plan removed prior authorization and step therapy on 2025-11-01. Mid-Atlantic rep calls stayed near 50 a week. National BXA rose 18.2% over the same weeks, so part of the lift is seasonal.
must_not_say:
  text: '"Q4 promotion lifted Mid-Atlantic."'
  phrases:
  - Q4 promotion lifted Mid-Atlantic
  semantic: []
action: Magdalena leaves this lift out of her campaign review.
eval_items:
- EV-4.5
- EV-4.2
- EV-3.4
