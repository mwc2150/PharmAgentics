id: C-052
lane: briefing
brand: BXC
story: BXC-P4-Q2
persona: P4 Marketer (Magdalena)
category: real_event
scenario: null
split: dev
status: draft
question: 'Weeks of 2026-09-14 to 2026-10-05: Which geographies, segments and channels responded, and which did not?'
review_note: null
period: weeks of 2026-09-14 to 2026-10-05
anchor: Metacora era split by territory, channel, specialty (Lipidara)
definition:
  first_week: '2026-09-14'
  last_week: '2026-10-05'
  comparison:
    kind: pre_launch
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Magdalena, I want the effect broken down by geography and channel, so that I can compare a campaign's area with the rest.
given: a brand-wide share loss with no territory lapse in promotion.
when: the Lipidara (BXC) brief reports it.
then: it shows each territory, channel and specialty against the pre-launch weeks, says the loss is broad, and flags small cells (cash) as noisy.
reference_answer: 'Over the latest four weeks (2026-09-14 to 2026-10-05), Lipidara TRx was 9.8% below the four weeks before Metacora launched (2026-02-02 to 2026-02-23), like for like on all 8 territories. The change is broad, not local. By territory: Mountain up 2.0%, Pacific down 4.9%, Northwest down 9.1%, Great Lakes down 9.3%, New England down 11.3%, Southeast down 11.7%, Mid-Atlantic down 13.7% and South Central down 15.4%. By channel: Medicaid down 6.0%, commercial down 10.4%, Medicare Part D down 10.7% and cash down 11.7%. By specialty: endocrinology down 7.1%, cardiology down 8.8%, primary care down 10.0% and internal medicine down 11.4%. Cash is a small cell (265 TRx a week nationally, as few as 18 a week in the smallest territory), so its figure is noisy.'
must_not_say:
  text: '"cash patients are leaving Lipidara fastest" from a base of a few dozen prescriptions a week.'
  phrases:
  - cash patients are leaving Lipidara fastest
  semantic: []
action: Magdalena notes that the loss is broad, so she plans by brand, not by territory or channel.
eval_items:
- EV-4.3
- EV-7.5
