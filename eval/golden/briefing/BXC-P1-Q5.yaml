story_text: As Ace, I want every material change surfaced and ranked, so that the brief is not judged on what it missed.
given: a week with one live competitor story and one territory that looks worth checking.
when: the Lipidara (BXC) brief runs.
then: the Metacora story appears, and the "considered and dropped" list shows Pacific supply as checked and not a Lipidara driver.
reference_answer: 'National BXC TRx was 3,894, 6.4% below its average for the four weeks before (2026-05-11 to 2026-06-01), on all 8 territories. One story was live: competitor Metacora (BXE), launched 2026-03-02, held 12.5% of the basket and was still climbing, while Lipidara''s share was 31.4%, against 35.4% in the four weeks before launch. The one territory worth checking, Pacific, is not a Lipidara story: Pacific BXC TRx was 626, 3.7% below its previous four weeks, with BXC inventory fill 0.975.'
must_not_say:
  text: '"BXC fell 6% nationally" with no mention of Metacora.'
  phrases: []
  semantic:
  - BXC fell 6% nationally
action: Ace scans the dropped list to confirm nothing large is missing, then signs off the draft for P2.
