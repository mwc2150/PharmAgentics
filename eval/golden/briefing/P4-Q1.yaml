id: C-019
lane: briefing
story: P4-Q1
persona: P4 Marketer (Magdalena)
category: real_event
scenario: null
split: dev
status: draft
question: 'Weeks of 2026-02-02 to 2026-04-06, Great Lakes: Did my campaign move brand sales, and by how much?'
review_note: null
period: weeks of 2026-02-02 to 2026-04-06, Great Lakes
anchor: Great Lakes coverage gap, Feb to Apr 2026
story_text: As Magdalena, I want promotion tested with a verdict either way, so that sales gains are not credited to whichever campaign launched last.
given: a territory where promotion lapses and then returns.
when: the brief tests promotion.
then: promotion gets a "supported" verdict for the Great Lakes drop, with the size stated as an association and the method named.
reference_answer: 'The release has no sustained BXA campaign push: rep calls and digital impressions never exceed 1.5 times their territory median, and sample spikes last a single week. The clearest read on promotion is its absence. In Great Lakes, aggregated rep calls fell from 48.5 a week to 19.5, and digital impressions averaged 915 against a median of 1,652. In the four weeks before Metacora launched, Great Lakes BXA TRx fell 16.5% while other territories rose 1.1%, 119.5 TRx a week below trend. When calls returned on 2026-04-13, Great Lakes TRx jumped from 503 to 730 in one week.'
must_not_say:
  text: '"promotion caused a 120 TRx lift," or credit promotion in any week where its activity did not change.'
  phrases:
  - promotion caused a 120 TRx lift
  semantic: []
action: Magdalena uses the lapse as evidence that field and digital presence holds BXA volume in Great Lakes.
eval_items:
- EV-4.5
- EV-4.1
facts:
- id: gl_change_pct
  value: -16.5
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-02-02'' and DATE ''2026-02-23'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-01-05'' and DATE ''2026-01-26'') - 1))'
  role: must
  reviewed: false
- id: gl_trx_week_2026_04_06
  value: 503
  sql: 'select (select sum(trx) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start = DATE ''2026-04-06'')'
  role: must
  reviewed: false
- id: gl_trx_week_2026_04_13
  value: 730
  sql: 'select (select sum(trx) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start = DATE ''2026-04-13'')'
  role: must
  reviewed: false
