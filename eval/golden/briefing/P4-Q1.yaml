  sql: 'select (select sum(rep_calls_aggregated) * 1.0 / count(distinct week_start) from raw.promo_activity where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-01-05'' and DATE ''2026-01-26'')'
  role: context
  reviewed: false
