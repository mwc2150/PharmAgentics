  sql: 'select (select sum(digital_impressions) * 1.0 / count(distinct week_start) from raw.promo_activity where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-02-02'' and DATE ''2026-04-06'')'
