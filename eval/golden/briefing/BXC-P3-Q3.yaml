id: C-047
lane: briefing
brand: BXC
story: BXC-P3-Q3
persona: P3 Brand Director (Diana)
category: real_event
scenario: null
split: dev
status: draft
question: 'Weeks of 2026-06-01 to 2026-06-29: Why did it happen, in terms I can explain to my leadership?'
review_note: null
period: weeks of 2026-06-01 to 2026-06-29
anchor: Metacora share gain in plain words, Jun 2026 (Lipidara)
definition:
  first_week: '2026-06-01'
  last_week: '2026-06-29'
  comparison:
    kind: pre_launch
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Diana, I want the explanation in plain words with one number each, so that I can repeat it upward.
given: a competitor launch that took share from a brand whose own coverage did not change.
when: the Lipidara (BXC) brief writes the story.
then: it uses short sentences, one idea and one number per sentence, and calls it a competitor problem, not a coverage or supply problem.
reference_answer: 'A plain-language version: "A new competitor, Metacora, launched on March 2. By June it filled 12.6 of every 100 prescriptions in this market. Lipidara''s share fell from 35.4 of every 100 to 31.3. Lipidara''s prescriptions are 18.1% below the weeks before the launch. Nothing changed in Lipidara''s insurance coverage."'
must_not_say:
  text: '"difference-in-differences," "share of voice," or any term Diana would have to translate.'
  phrases:
  - difference-in-differences
  - share of voice
  semantic: []
action: Diana tells leadership it was a new competitor, not Lipidara's coverage. The brief tells her to ask marketing for its defense plan.
eval_items:
- EV-7.1
facts:
- id: metacora_share_june_pct
  role: must
  value: 12.6
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXE') / sum(trx) from reporting.v_weekly_rx_kpis where week_start between DATE '2026-06-01' and DATE '2026-06-29'
  reviewed: false
- id: bxc_share_june_pct
  role: must
  value: 31.3
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXC') / sum(trx) from reporting.v_weekly_rx_kpis where week_start between DATE '2026-06-01' and DATE '2026-06-29'
  reviewed: false
- id: bxc_share_pre_launch_pct
  role: must
  value: 35.4
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXC') / sum(trx) from reporting.v_weekly_rx_kpis where week_start between DATE '2026-02-02' and DATE '2026-02-23'
  reviewed: false
- id: bxc_change_pct
  role: context
  value: -18.1
  sql: with ok as (select territory_id from reporting.v_feed_health where (week_start between DATE '2026-06-01' and DATE '2026-06-29' or week_start between DATE '2026-02-02' and DATE '2026-02-23') group by 1 having count(*) = 9 and count(*) filter (where health_status = 'PASS') = 9) select 100.0 * (((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start between DATE '2026-06-01' and DATE '2026-06-29' and territory_id in (select territory_id from ok)) / 5.0) / ((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start between DATE '2026-02-02' and DATE '2026-02-23' and territory_id in (select territory_id from ok)) / 4.0) - 1)
  reviewed: false
- id: bxc_access_changes_in_release
  role: context
  value: 0
  sql: select count(*) from (select plan_id, month, formulary_tier, lag(formulary_tier) over w pt, prior_authorization pa, lag(prior_authorization) over w ppa, step_therapy st, lag(step_therapy) over w pst, covered c, lag(covered) over w pc from raw.access_status_monthly where product_id = 'BXC' window w as (partition by plan_id order by month)) where pt is not null and (formulary_tier <> pt or pa <> ppa or st <> pst or c <> pc)
  reviewed: false
findings:
- id: national_metacora_share_gain
  territory: NATIONAL
  direction: down
  drivers_supported:
  - competitor
  drivers_ruled_out:
  - access
  withheld: false
  reviewed: false
  measure: bxa_share
