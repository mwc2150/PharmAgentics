id: C-039
lane: briefing
brand: BXC
story: BXC-P2-Q1
persona: P2 Insights Manager (Marcus)
category: data_artifact
scenario: null
split: dev
status: draft
question: 'Week of 2026-04-06, today''s snapshot: Is this change real, or a data or calendar artifact?'
review_note: null
period: week of 2026-04-06, today's snapshot
anchor: Mid-Atlantic cut withheld, 2026-04-06 (Lipidara)
definition:
  first_week: '2026-04-06'
  last_week: '2026-04-06'
  comparison:
    kind: previous
    weeks: 1
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Marcus, I want data artifacts separated from business change before any explanation, so that I never send leadership a story that unravels.
given: a week where one territory's cut is withheld for restatement review.
when: the Lipidara (BXC) brief re-runs on the current snapshot.
then: the national dip is labelled a data artifact, the like-for-like change on 7 territories is stated, and no business story opens unless that like-for-like change clears the materiality thresholds.
reference_answer: 'Summed over reportable cuts, national BXC TRx is 3,892, down 19.4% from 4,826 the week before. But Mid-Atlantic is withheld: its feed for that week is flagged RESTATEMENT_REVIEW. On the 7 territories that report both weeks, BXC went from 4,008 to 3,892, a 2.9% dip.'
must_not_say:
  text: '"BXC fell 19% nationally."'
  phrases:
  - BXC fell 19% nationally
  semantic: []
action: Marcus approves the "data artifact" label and raises the restatement review with the data vendor. The brief tells him which cut to re-check.
eval_items:
- EV-2.2
- EV-2.1
- EV-3.2
facts:
- id: national_bxc_trx
  role: context
  value: 3892
  sql: select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-04-06'
  reviewed: false
- id: national_prior_week
  role: context
  value: 4826
  sql: select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-03-30'
  reviewed: false
- id: national_change_pct
  role: must
  value: -19.4
  sql: select 100.0 * ((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-04-06') / (select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-03-30') - 1)
  reviewed: false
- id: mid_atlantic_flag
  role: context
  value: RESTATEMENT_REVIEW
  sql: select flag_reasons from reporting.v_feed_health where week_start = DATE '2026-04-06' and territory_id = 'MID_ATLANTIC'
  reviewed: false
- id: seven_territory_prior_week
  role: context
  value: 4008
  sql: select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-03-30' and territory_id <> 'MID_ATLANTIC'
  reviewed: false
- id: seven_territory_change_pct
  role: must
  value: -2.9
  sql: select 100.0 * ((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-04-06') / (select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start = DATE '2026-03-30' and territory_id <> 'MID_ATLANTIC') - 1)
  reviewed: false
