period: week of 2026-04-06, Mid-Atlantic
anchor: Mid-Atlantic restatement, 692 to 742
story_text: As Marcus, I want every claim answered against the numbers as they stood at sign-off, so that a challenge does not mean rebuilding the analyst's work.
given: a figure restated after sign-off.
when: someone challenges the April number.
then: its evidence link opens the value on the snapshot pinned at sign-off (692) and the restatement record beside it.
reference_answer: 'The brief signed off in April reported Mid-Atlantic BXA TRx of 692 for that week. On 2026-07-13 the vendor restated all 32 cells (reason: late claims adjustment) to 742, up 50 (7.2%). NBRx moved from 97 to 98.'
must_not_say:
  text: '"742" as if it were the figure signed off in April.'
  phrases: []
  semantic:
  - '742'
action: 'Marcus answers on the spot: the April figure was right for the data of the day and was later restated.'
