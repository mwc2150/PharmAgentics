facts:
- id: metacora_share_pct
  value: 9.3
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXE') / sum(trx) from reporting.v_weekly_rx_kpis where week_start = DATE '2026-04-27'
- id: bxa_share_pct
  value: 33.2
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXA') / sum(trx) from reporting.v_weekly_rx_kpis where week_start = DATE '2026-04-27'
- id: bxa_share_pre_launch_pct
  value: 35.8
  sql: select 100.0 * sum(trx) filter (where product_id = 'BXA') / sum(trx) from reporting.v_weekly_rx_kpis where week_start = DATE '2026-02-23'
