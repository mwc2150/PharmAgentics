reference_answer: Eight weeks after launch, competitor Metacora (BXE) held 9.3% of the four-brand basket. BXA's share was 33.2%, down 2.6 points from 35.8% in the last week before launch (2026-02-23). No access, promotion or supply table shows a new event that week.
