question: 'Weeks of 2026-06-15 to 2026-07-13, South Central: How confident are we, and where should we say we don''t know yet?'
review_note: null
period: weeks of 2026-06-15 to 2026-07-13, South Central
anchor: South Central gap, Jun to Jul 2026 (Lipidara)
definition:
  first_week: '2026-06-15'
  last_week: '2026-07-13'
  comparison:
    kind: previous
    weeks: 4
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Marcus, I want an honest "not enough evidence yet," so that I never overclaim in front of leadership.
given: a sustained regional gap with no driver visible in access, promotion, supply, competitor or feed data.
when: the Lipidara (BXC) brief investigates.
then: the story closes at Low confidence as "unresolved, investigate next," lists the checks run, and names no driver.
reference_answer: 'Like for like (the seven territories that report in every week compared; Great Lakes is out because its 2026-07-06 feed fails), South Central BXC TRx averaged 17.0% below the four weeks before (2026-05-18 to 2026-06-08) while the other territories rose 0.6%, a gap of 17.6 points. Nothing in the context tables explains it: South Central rep calls averaged 27 a week (median 27) with no vacancy, no Lipidara plan changed tier, prior authorization or step therapy, inventory fill averaged 0.987, and every South Central feed passed. Metacora''s share there (13.0%) is within the range of the other territories (12.3% to 13.5%).'
must_not_say:
  text: '"South Central is down because of Metacora."'
  phrases:
  - South Central is down because of Metacora
  semantic: []
action: 'Marcus presents it as "still investigating." The brief tells him what to check next: plan and specialty splits, and local context from sales leadership.'
eval_items:
- EV-5.1
- EV-5.2
- EV-5.3
