  sql: with n as (select week_start, sum(trx) nat from reporting.v_weekly_rx_kpis where product_id = 'BXC' group by 1), a as (select week_start, nat, avg(nat) over (order by week_start rows between 4 preceding and 1 preceding) a4 from n) select min(100.0 * (nat / a4 - 1)) from a where week_start in (DATE '2026-04-06', DATE '2026-05-04', DATE '2026-07-06')
  reviewed: false
- id: feed_artifact_weeks
