story_text: As Ace, I want every figure in the draft to match the pinned data, so that I review the brief instead of rebuilding it.
given: the snapshot pinned for 2026-07-06 holds 15 duplicate Rx keys in Great Lakes.
when: the Lipidara (BXC) brief runs.
then: every KPI figure matches the gated view on that snapshot, Great Lakes shows as withheld, and national figures carry the label "7 of 8 territories."
reference_answer: 'The Great Lakes feed has 143 rows against 128 expected: 15 duplicate keys. Summed raw, Great Lakes BXC TRx is 615; with duplicates removed it is 583, so a naive sum overstates it by 32 TRx (5.5%). The gate withholds the whole Great Lakes cut, so national BXC TRx from reportable cuts is 3,373 across 7 of 8 territories.'
must_not_say:
  text: '"Great Lakes BXC TRx was 615," or quote 3,373 as a full national total.'
  phrases:
  - Great Lakes BXC TRx was 615
  semantic: []
action: Ace opens two claim links at random, confirms the withheld cut, and asks P2 to request a clean reload. No table is rebuilt.
