  sql: select count(distinct territory_id) from reporting.v_feed_health h where week_start between DATE '2026-06-15' and DATE '2026-07-13' and not exists (select 1 from reporting.v_feed_health f where f.territory_id = h.territory_id and f.week_start between DATE '2026-06-15' and DATE '2026-07-13' and f.health_status <> 'PASS')
  reviewed: false
- id: like_for_like_change_pct
  role: must
  value: -6.1
  sql: with ok as (select territory_id from reporting.v_feed_health where (week_start between DATE '2026-06-15' and DATE '2026-07-06' or week_start between DATE '2026-07-13' and DATE '2026-07-13') group by 1 having count(*) = 5 and count(*) filter (where health_status = 'PASS') = 5) select 100.0 * (((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start between DATE '2026-07-13' and DATE '2026-07-13' and territory_id in (select territory_id from ok)) / 1.0) / ((select sum(trx) from reporting.v_weekly_rx_kpis where product_id = 'BXC' and week_start between DATE '2026-06-15' and DATE '2026-07-06' and territory_id in (select territory_id from ok)) / 4.0) - 1)
  reviewed: false
