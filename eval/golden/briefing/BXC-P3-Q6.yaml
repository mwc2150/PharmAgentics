story_text: As Diana, I want numbers that will not be corrected later, so that my credibility holds upward.
given: a brief for a week after a failed feed, with no restatement of any Lipidara number.
when: the next Lipidara (BXC) brief runs.
then: it quotes the KPI table without a correction note, any like-for-like figure built on 7 territories says so, and the projected national labels a projected or estimated territory as an assumption instead of leaving it out.
reference_answer: 'No Lipidara figure has been restated: the restatement log holds no row for BXC. Projected national BXC TRx for the week of 2026-07-13 is 3,830, with every territory observed (8 of 8 pass). The like-for-like change against the four weeks before (2026-06-15 to 2026-07-06) is 6.1% down and covers 7 of 8 territories, because Great Lakes failed its checks for 2026-07-06. Three weeks in the release have one failed territory cut (2026-04-06, 2026-05-04, 2026-07-06); their projected national labels that territory as projected or estimated, an assumption, instead of leaving it out.'
must_not_say:
  text: a restatement note for a Lipidara number that was not restated, or a like-for-like change that does not say it covers 7 of 8 territories.
  phrases:
  - Lipidara was restated
  semantic: []
action: Diana quotes only from the KPI table. The brief tells her no earlier Lipidara figure changed.
eval_items:
- EV-1.1
- EV-1.2
