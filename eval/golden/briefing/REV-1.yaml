  reviewed: true
- id: se_calls_comparison
  value: 52
  sql: select avg(rep_calls_aggregated) from raw.promo_activity where product_id = 'BXA' and territory_id = 'SOUTHEAST' and week_start between DATE '2026-09-07' and DATE '2026-09-28'
  role: context
  reviewed: true
- id: se_lapse_calls_low
  value: 15
  sql: select min(rep_calls_aggregated) from raw.promo_activity where product_id = 'BXA' and territory_id = 'SOUTHEAST' and week_start between DATE '2026-08-03' and DATE '2026-08-31'
  role: context
  reviewed: true
- id: se_lapse_calls_high
  value: 26
  sql: select max(rep_calls_aggregated) from raw.promo_activity where product_id = 'BXA' and territory_id = 'SOUTHEAST' and week_start between DATE '2026-08-03' and DATE '2026-08-31'
