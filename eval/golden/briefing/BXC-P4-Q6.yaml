persona: P4 Marketer (Magdalena)
category: stress
scenario: null
split: dev
status: draft
question: 'Weeks of 2026-09-14 to 2026-10-05: Where should the next dollar go?'
review_note: null
period: weeks of 2026-09-14 to 2026-10-05
anchor: No territory lapse, broad Metacora-era loss (Lipidara)
definition:
  first_week: '2026-09-14'
  last_week: '2026-10-05'
  comparison:
    kind: pre_launch
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Magdalena, I want budget arguments grounded in evidence, so that shifts are not argued from anecdote.
given: a brand-wide share loss with steady promotion in every territory.
when: the Lipidara (BXC) brief writes next steps.
then: it says the data supports no territory-specific shift, recommends discussing next steps with marketing at brand level, and says the promotion effect cannot be measured here.
reference_answer: 'The data supports no territory-specific shift for Lipidara. No territory had a promotion lapse: rep calls across all territories averaged 215 a week against 220 before Metacora launched, and no territory fell below 0.91 of its own pre-launch level. Digital impressions across all territories were 7,613 a week against 7,295. TRx is 9.8% below the pre-launch weeks and the loss is broad: 7 of 8 territories are below their own pre-launch level, South Central most (15.4%) and Mountain not at all (up 2.0%). It cannot rank channels or price a dollar: there is no spend data, no reach by segment, and no promotion change to measure a response against.'
must_not_say:
  text: a cost per incremental prescription, or any rep-level line.
  phrases: []
  semantic: []
action: Magdalena takes the finding into the budget talk with P3 and asks for spend and reach data to test a response.
eval_items:
- EV-7.3
- EV-9.1
