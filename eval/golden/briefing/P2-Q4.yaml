id: C-010
lane: briefing
story: P2-Q4
persona: P2 Insights Manager (Marcus)
category: real_event
scenario: null
split: dev
status: draft
question: 'Weeks of 2025-08-04 to 2025-10-27: Where is the change concentrated?'
review_note: null
period: weeks of 2025-08-04 to 2025-10-27
anchor: Mid-Atlantic access change
story_text: As Marcus, I want a national number broken down to where it actually happens, so that the right team acts.
given: a plan-level access change hidden inside a rising national trend.
when: the brief runs.
then: concentration names territory, channel, plan and specialty, and the segment contributions sum to the territory change.
reference_answer: 'Nationally the dip is invisible: BXA TRx rose 9.0% against June and July. Mid-Atlantic rose only 3.2%. Inside Mid-Atlantic, one Medicare Part D plan with 26% of the territory''s covered lives fell 22.5% (about 41 TRx a week), while the territory''s other channels rose 15.1%. The largest NBRx loss on that plan is in primary care, 12.1 to 7.3 a week.'
must_not_say:
  text: '"Mid-Atlantic Medicare is down" without the plan, or "BXA is growing nationally, no issues."'
  phrases:
  - BXA is growing nationally, no issues
  semantic:
  - Mid-Atlantic Medicare is down
action: Marcus routes the story to market access with the plan named.
eval_items:
- EV-4.3
- EV-3.1
facts:
- id: national_change_pct
  value: 9.0
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - 1))'
  role: must
  reviewed: false
- id: ma_change_pct
  value: 3.2
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''MID_ATLANTIC'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''MID_ATLANTIC'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - 1))'
  role: must
  reviewed: false
- id: plan_change_pct
  value: -22.5
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - 1))'
  role: must
  reviewed: false
- id: ma_other_channels_change_pct
  value: 15.1
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and territory_id = ''MID_ATLANTIC'' and payer_channel <> ''MEDICARE_PART_D'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and territory_id = ''MID_ATLANTIC'' and payer_channel <> ''MEDICARE_PART_D'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - 1))'
  role: context
  reviewed: false
- id: plan_trx_drop_per_week
  value: 41
  sql: 'select (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'')'
  role: context
  reviewed: false
- id: plan_primary_care_nbrx_before
  value: 12.1
  sql: 'select (select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and hcp_specialty = ''PRIMARY_CARE'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'')'
  role: context
  reviewed: false
- id: plan_primary_care_nbrx_after
  value: 7.3
  sql: 'select (select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and hcp_specialty = ''PRIMARY_CARE'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'')'
  role: context
  reviewed: false
