story_text: As Diana, I want next steps and the right function named, so that implications for sales, access and finance are not left implicit.
given: a plan-level rise that came from a competitor's access change, shown only at plan and territory level.
when: the Lipidara (BXC) brief writes next steps.
then: it says "involve market access on the plan" and "involve sales leadership on Mid-Atlantic," and stays at territory level.
reference_answer: 'Lipidara TRx on one Mid-Atlantic Medicare Part D plan rose 21.1% (162 to 197 TRx a week, Labor Day week left out) without any change on Lipidara''s side there: rep calls in Mid-Atlantic averaged 32 a week against 31 before, and Lipidara''s tier on the plan stayed at 3. The change on the plan was a competitor''s: Cardiovela (BXA) moved from tier 2 to tier 3 on 2025-08-01 and returned to tier 2 on 2025-11-01. The plan carries 26.0% of the territory''s covered lives. Next steps: involve market access on that plan (what Lipidara''s own formulary position is, and whether the competitor''s move will repeat) and sales leadership on Mid-Atlantic, at territory level.'
must_not_say:
  text: any line that points to one rep, or a claim that Lipidara's own access improved.
  phrases:
  - Lipidara access improved
  semantic: []
action: Diana asks market access about the plan and takes the finding into budget talks with P4.
eval_items:
- EV-7.3
- EV-9.1
