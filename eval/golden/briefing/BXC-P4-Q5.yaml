scenario: null
split: dev
status: draft
question: 'Weeks of 2025-08-04 to 2025-10-27, Mid-Atlantic: How confident is the estimate, and when will we know more?'
review_note: null
period: weeks of 2025-08-04 to 2025-10-27, Mid-Atlantic
anchor: Confidence in the Mid-Atlantic plan estimate (Lipidara)
definition:
  first_week: '2025-08-04'
  last_week: '2025-10-27'
  comparison:
    kind: custom
    start: '2025-06-02'
    end: '2025-07-28'
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Magdalena, I want confidence and timing stated plainly, so that early reads don't mislead the budget.
given: one plan in one territory, one competitor access change and one reversal.
when: the Lipidara (BXC) brief reports confidence.
then: it says Low, names the single plan, says the figure is an association, and states when the next read is due.
reference_answer: 'Low. The Mid-Atlantic estimate rests on one plan in one territory and is an association. From 2025-08-04 to 2025-10-27 (Labor Day week left out), Lipidara TRx on the plan rose 21.1% against the summer, 9.6 points more than the territory''s other plans (11.5%). At most, that gap is what a competitor''s tier change on 2025-08-01 could account for. The one test the data offers did not confirm it: when Cardiovela''s tier went back to 2 on 2025-11-01, Lipidara''s plan TRx kept rising (13.3% above August to October, against 8.4% for the other plans). In this data a formulary change shows within the first week, so a re-read four weeks after the plan''s next change is enough.'
must_not_say:
  text: '"High confidence" from one plan.'
  phrases: []
  semantic:
  - High confidence
action: Magdalena waits for the four-week re-read before moving budget.
eval_items:
- EV-5.1
- EV-4.4
- EV-7.2
