story_text: As Ace, I want one click from any figure to the query behind it, so that tracing takes seconds, not an afternoon.
given: a story that cites a plan-level NBRx change and an access change.
when: Ace clicks either number.
then: it opens an evidence item naming the tool, its parameters (plan, product, weeks), the pinned snapshot and the trace span.
reference_answer: 'Take the claim "BXA new-to-brand prescriptions on one Mid-Atlantic Medicare Part D plan fell 37%." It comes from the gated Rx view for plan SYN_MID_ATLANTIC_MEDICARE_PART_D_1: 15.0 NBRx a week over 13 weeks, against 23.8 a week over the 9 weeks before. The cause cited beside it comes from access_status_monthly: that plan moved BXA from tier 2 to tier 3 and added prior authorization and step therapy, effective 2025-08-01.'
must_not_say:
  text: a figure with no evidence link.
  phrases: []
  semantic: []
action: Ace checks the link instead of re-querying. Reviewer minutes to trace are logged against the manual baseline.
eval_items:
- EV-6.1
- EV-6.2
- EV-6.3
facts:
- id: plan_nbrx_change_pct
  value: -37
  sql: 'select (100.0 * ((select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'') / (select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'') - 1))'
  role: must
  reviewed: true
  needs: plan_cut
- id: plan_nbrx_before_per_week
  value: 23.8
  sql: 'select (select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-06-02'' and DATE ''2025-08-01'')'
  role: must
  reviewed: true
  needs: plan_cut
- id: plan_nbrx_after_per_week
  value: 15.0
  sql: 'select (select sum(nbrx) * 1.0 / count(distinct week_start) from reporting.v_reportable_rx where product_id = ''BXA'' and plan_id = ''SYN_MID_ATLANTIC_MEDICARE_PART_D_1'' and week_start between DATE ''2025-08-04'' and DATE ''2025-10-27'')'
  role: must
  reviewed: true
  needs: plan_cut
- id: plan_tier_before_change
  value: 2
