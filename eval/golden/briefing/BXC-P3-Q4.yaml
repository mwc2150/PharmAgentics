story_text: As Diana, I want continuing stories marked with their trend, so that repeated alarms don't erode attention.
given: a story that has run for months.
when: the Lipidara (BXC) brief runs.
then: it is marked "continuing," states the direction (worse, now flat), and is not rediscovered as new.
reference_answer: The Metacora story is in its 31st week. Its share of the basket, averaged over 4-week blocks, went 2.2%, 6.7%, 9.8%, 12.0%, 13.1%, 13.8%, 15.3% and 15.2%. Lipidara's share over the same blocks went 34.7%, 33.2%, 31.5%, 31.1%, 30.4%, 30.9%, 29.8% and 29.7%. It is worse than at launch but has flattened for the last 8 weeks. That week Lipidara held 29.4% and Metacora 15.2%.
must_not_say:
  text: '"New: competitor gaining share."'
  phrases:
  - 'New: competitor gaining share'
  semantic: []
action: Diana moves from alarm to monitoring. The brief tells her to ask marketing for its defense plan.
eval_items:
- EV-7.2
