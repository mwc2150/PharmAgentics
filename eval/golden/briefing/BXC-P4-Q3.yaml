  value: 1076
  sql: select avg(digital_impressions) from raw.promo_activity where product_id = 'BXC' and territory_id = 'MID_ATLANTIC' and week_start between DATE '2025-08-04' and DATE '2025-10-27' and week_start <> DATE '2025-09-01'
  reviewed: false
