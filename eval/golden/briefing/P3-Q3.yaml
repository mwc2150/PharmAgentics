id: C-015
lane: briefing
story: P3-Q3
persona: P3 Brand Director (Diana)
category: real_event
scenario: null
split: dev
status: draft
question: 'Weeks of 2026-06-01 to 2026-06-29, Pacific: Why did it happen, in terms I can explain to my leadership?'
review_note: null
period: weeks of 2026-06-01 to 2026-06-29, Pacific
anchor: Pacific supply, Jun 2026
definition:
  first_week: '2026-06-01'
  last_week: '2026-06-29'
  comparison:
    kind: previous
    weeks: 4
  territories: like_for_like
  measure: trx
  grain: [national, territory, plan, channel, specialty]
  relative_to: other_territories
story_text: As Diana, I want the explanation in plain words with one number each, so that I can repeat it upward.
given: a regional supply shortfall with a clean recovery.
when: the brief writes the story.
then: it uses short sentences, one idea and one number per sentence, and calls it a supply problem, not a demand problem.
reference_answer: 'A plain-language version: "For five weeks in June, Pacific pharmacies could fill only about 7 in 10 BXA orders. Pacific BXA prescriptions fell 34% while other territories fell 1%. Supply returned to normal on July 6, and prescriptions recovered."'
must_not_say:
  text: '"difference-in-differences," "fill-rate elasticity," or any term Diana would have to translate.'
  phrases:
  - difference-in-differences
  - fill-rate elasticity
  semantic: []
action: Diana tells leadership it was supply, not demand. The brief tells her to ask supply chain and trade for the root cause.
eval_items:
- EV-7.1
facts:
- id: pacific_change_pct
  value: -34.0
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''PACIFIC'' and week_start between DATE ''2026-06-01'' and DATE ''2026-06-29'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''PACIFIC'' and week_start between DATE ''2026-05-04'' and DATE ''2026-05-25'') - 1))'
  role: must
  reviewed: true
- id: other_territories_change_pct
  value: -1
  sql: 'select (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''PACIFIC'' and week_start between DATE ''2026-06-01'' and DATE ''2026-06-29'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''PACIFIC'' and week_start between DATE ''2026-05-04'' and DATE ''2026-05-25'') - 1))'
  role: context
  reviewed: false
- id: pacific_fill_rate_june
  value: 0.7
  sql: 'select avg(inventory_fill_rate) from raw.inventory_weekly where product_id = ''BXA'' and territory_id = ''PACIFIC'' and week_start between DATE ''2026-06-01'' and DATE ''2026-06-29'''
  role: must
  reviewed: true
findings:
- id: pacific_supply_shortfall
  territory: PACIFIC
  direction: down
  drivers_supported: [supply]
  drivers_ruled_out: []
  withheld: false
  reviewed: true
