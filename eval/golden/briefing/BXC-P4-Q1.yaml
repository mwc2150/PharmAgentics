- id: longest_run_calls_above_1_25x_median_weeks
  role: context
  value: 3
  sql: with m as (select territory_id, median(rep_calls_aggregated) mc from raw.promo_activity where product_id = 'BXC' group by 1), f as (select p.territory_id, p.week_start, (p.rep_calls_aggregated * 1.0 / mc > 1.25) hi from raw.promo_activity p join m using (territory_id) where p.product_id = 'BXC'), g as (select *, row_number() over (partition by territory_id order by week_start) rn from f), r as (select territory_id, hi, rn - row_number() over (partition by territory_id, hi order by week_start) grp from g) select max(c) from (select territory_id, grp, count(*) c from r where hi group by all)
  reviewed: false
