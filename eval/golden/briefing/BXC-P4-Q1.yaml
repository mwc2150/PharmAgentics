story: BXC-P4-Q1
persona: P4 Marketer (Magdalena)
category: null_week
scenario: null
split: dev
status: draft
question: 'Week of 2026-08-10, Southeast: Did my campaign move brand sales, and by how much?'
review_note: null
period: week of 2026-08-10, Southeast
anchor: Southeast rep-call spike, 2026-08-10 (Lipidara)
definition:
  first_week: '2026-08-10'
  last_week: '2026-08-10'
  comparison:
    kind: previous
    weeks: 4
  territories: like_for_like
  measure: trx
  grain:
  - national
  - territory
  - plan
  - channel
  - specialty
  relative_to: other_territories
story_text: As Magdalena, I want promotion tested with a verdict either way, so that sales gains are not credited to whichever campaign launched last.
given: a territory where one week of promotion activity stands out from its median.
when: the Lipidara (BXC) brief tests promotion.
then: promotion gets a verdict of not supported for that week, with the TRx before, during and after stated and no lift credited to the campaign.
reference_answer: 'The release has no lasting Lipidara campaign push: in no territory did rep calls stay above 1.25 times their median for more than 3 weeks in a row. The clearest spike is Southeast in the week of 2026-08-10: rep calls were 49 against a median of 33, and digital impressions 1,125 against a median of 1,122.5. Southeast BXC TRx that week was 583, 9.3% below its previous four weeks (2026-07-13 to 2026-08-03, average 643) while the other territories rose 5.3%. The next week it was 649, 0.9% above those four weeks. Promotion is not supported: the spike week did not lift TRx.'
must_not_say:
  text: '"promotion caused a lift," or credit promotion in any week where its activity did not change.'
  phrases:
  - promotion caused a lift
  semantic: []
action: Magdalena does not use the spike week as evidence of a campaign effect.
eval_items:
- EV-4.5
- EV-4.1
