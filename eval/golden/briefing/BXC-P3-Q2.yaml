  - specialty
  relative_to: other_territories
story_text: As Diana, I want expected seasonal dips labelled, so that I am not pulled into false alarms.
given: two holiday weeks with lower business days.
when: the Lipidara (BXC) brief runs.
then: it labels the drop a calendar effect, cites last year's same weeks, and opens no story.
reference_answer: National BXC TRx was 4,041 and 3,987, together 20.2% below the four weeks before (2025-11-24 to 2025-12-15), or 19.7% and 20.8% week by week. Both weeks had 4 business days, and the second was the plan-year reset. The same two weeks a year earlier were 18.4% below their four weeks before (2024-11-25 to 2024-12-16), or 21.1% and 15.6% week by week. The next week rebounded to 4,656, up 16.8%.
must_not_say:
  text: '"BXC fell 20%" with no calendar label.'
  phrases: []
  semantic:
  - BXC fell 20%
action: Diana ignores it. The brief tells her to expect the rebound the next week.
eval_items:
- EV-3.4
- EV-3.2
