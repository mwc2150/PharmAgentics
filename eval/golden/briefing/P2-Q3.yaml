status: draft
question: 'Weeks of 2026-08-31 to 2026-09-28, South Central: How confident are we, and where should we say we don''t know yet?'
review_note: null
period: weeks of 2026-08-31 to 2026-09-28, South Central
anchor: South Central gap, Sep 2026
definition:
  first_week: '2026-08-31'
  last_week: '2026-09-28'
  comparison:
    kind: custom
    start: '2026-07-06'
    end: '2026-07-27'
  territories: like_for_like
  measure: trx
  grain: [national, territory, plan, channel, specialty]
  relative_to: other_territories
story_text: As Marcus, I want an honest "not enough evidence yet," so that I never overclaim in front of leadership.
given: a sustained regional gap with no driver visible in access, promotion, supply, competitor or feed data.
when: the brief investigates.
then: the story closes at Low confidence as "unresolved, investigate next," lists the checks run, and names no driver.
reference_answer: 'Like for like (the seven territories that report in every week compared, Labor Day week left out), South Central BXA TRx slipped 2.9% from July while the other territories rose 9.1%, a gap of 12.0 points. Nothing in the context tables explains it: rep calls averaged 46 a week (normal is about 46) with no vacancy, no South Central plan put BXA or its older competitors under prior authorization or step therapy, inventory fill averaged 0.984, and every feed passed. Metacora''s share there (16.2%) is only slightly above other territories (13.6% to 16.0%).'
must_not_say:
  text: '"South Central is down because of Metacora."'
  phrases:
  - South Central is down because of Metacora
  semantic: []
action: 'Marcus presents it as "still investigating." The brief tells him what to check next: plan and specialty splits, and local context from sales leadership.'
eval_items:
- EV-5.1
- EV-5.2
- EV-5.3
