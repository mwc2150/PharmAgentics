id: C-024
lane: briefing
story: P4-Q6
persona: P4 Marketer (Magdalena)
category: stress
scenario: null
split: dev
status: draft
question: Where should the next dollar go?
review_note: The story states no period; add the weeks to the question before freezing.
period: null
anchor: Great Lakes and Southeast together
story_text: As Magdalena, I want budget arguments grounded in evidence, so that shifts are not argued from anecdote.
given: two lapses where calls and digital fell together.
when: the brief writes next steps.
then: it recommends discussing backfill for open coverage with sales operations, at territory level, and says the rep and digital effects cannot be separated.
reference_answer: 'The data supports one conclusion: keep promotion running in a territory when coverage lapses. Both gaps cost 119.5 to 199.9 BXA TRx a week relative to other territories and largely recovered when coverage returned. It cannot rank channels or price a dollar, because digital impressions fell along with calls and there is no spend data.'
must_not_say:
  text: a cost per incremental prescription, or any rep-level line.
  phrases: []
  semantic: []
action: Magdalena takes the coverage finding into the budget talk with P3 and asks for a digital-only test during the next gap.
eval_items:
- EV-7.3
- EV-9.1
facts:
- id: gl_trend_loss_per_week
  value: 119.5
  sql: 'select -((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-02-02'' and DATE ''2026-02-23'') - (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''GREAT_LAKES'' and week_start between DATE ''2026-01-05'' and DATE ''2026-01-26'') * (1 + (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''GREAT_LAKES'' and week_start between DATE ''2026-02-02'' and DATE ''2026-02-23'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''GREAT_LAKES'' and week_start between DATE ''2026-01-05'' and DATE ''2026-01-26'') - 1)) / 100.0))'
  role: context
  reviewed: false
- id: se_trend_loss_per_week
  value: 199.9
  sql: 'select -((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''SOUTHEAST'' and week_start between DATE ''2026-08-03'' and DATE ''2026-08-31'') - (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id = ''SOUTHEAST'' and week_start between DATE ''2026-07-06'' and DATE ''2026-07-27'') * (1 + (100.0 * ((select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''SOUTHEAST'' and week_start between DATE ''2026-08-03'' and DATE ''2026-08-31'') / (select sum(trx) * 1.0 / count(distinct week_start) from reporting.v_weekly_rx_kpis where product_id = ''BXA'' and territory_id <> ''SOUTHEAST'' and week_start between DATE ''2026-07-06'' and DATE ''2026-07-27'') - 1)) / 100.0))'
  role: context
  reviewed: false
