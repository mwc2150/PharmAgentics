name: DuckDB data foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Same uv.lock as every laptop; the data tests need only the base and dev groups.
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run python src/pharmagentics/data/load_duckdb.py
      # The fixture intentionally contains feed flags; the tests assert them.
      - run: uv run python src/pharmagentics/data/check_duckdb.py
      - run: uv run python -m unittest discover -s tests -v

  # Golden-set integrity, code checks, isolation scans and an end-to-end MLflow run.
  # No model is needed: LLM controls and judges run locally on demand.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python src/pharmagentics/data/load_duckdb.py
      - run: uv run pytest tests/test_tools.py eval/tests -q
