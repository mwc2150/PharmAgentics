name: DuckDB data foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Same uv.lock as every laptop, every group: the whole suite imports the API, the agents and the eval harness.
      - run: uv sync --locked
      - run: uv run python src/pharmagentics/data/load_duckdb.py
      # The fixture intentionally contains feed flags; the tests assert them.
      - run: uv run python src/pharmagentics/data/check_duckdb.py
      # The whole suite (pyproject testpaths: tests/, eval/tests and the Forecast lane's tests). unittest discovery
      # found only the unittest-style files, so the pytest-style ones, including every Forecast test, never ran here.
      # No model in CI: the Forecast lane runs its rules, and a test that needs a local model skips.
      - run: uv run pytest -q
        env:
          FORECAST_AGENT_MODEL: rules

  # Golden-set integrity, code checks, isolation scans and an end-to-end MLflow run.
  # No model is needed: LLM controls and judges run locally on demand.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python src/pharmagentics/data/load_duckdb.py
      # The tests run in the integration job; this one checks the golden set and recomputes every fact from the data.
      - run: uv run python -m eval check

  # core-007 and brief-002: role-based views, sign-in, triage review, agent build (no model) and job queue.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --group api --group agent
      - run: uv run python src/pharmagentics/data/load_duckdb.py
      # Roles and views, sign-in, triage review, the agent build's pure parts (no model), and the job queue.
      - run: >
          uv run pytest tests/test_brand_access.py tests/test_classification.py tests/test_rbac.py tests/test_briefing_api.py tests/test_briefing_smoke.py
          tests/test_frontend_scope.py tests/test_deploy.py tests/test_triage.py tests/test_jobs.py
          tests/test_agent_build3.py tests/test_feedback.py -q

  # core-007 FR-018: the UAT image builds (UI type-checked) and holds no eval or ground-truth file.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pharmagentics:ci .
      - name: Content check
        run: >
          docker run --rm --entrypoint sh pharmagentics:ci -c
          "test ! -e /app/eval && test ! -e /app/.env && test ! -e /app/SoT &&
          ! find / -xdev \( -name 'answer_key*' -o -name '*counterfactual*' -o -name 'heldout_params*'
          -o -name '*true_before_feed_artifacts*' \) 2>/dev/null | grep -q ."
